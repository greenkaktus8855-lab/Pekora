name: Pekora checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
      - name: Check browser 3D avatar module syntax
        run: node --check public/avatar-viewer.js
      - name: Check Worker module syntax
        run: node --input-type=module --check < src/worker.js
      - name: Check static assets and critical safeguards
        run: node scripts/check-static.mjs
      - name: Check SQLite transaction behavior
        run: python3 scripts/check-sqlite.py
