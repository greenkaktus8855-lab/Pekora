name = "pekora"
main = "src/worker.js"
compatibility_date = "2026-10-30"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pekora-db"
database_id = "46cf2725-2ea1-4da3-9e9e-ffe30f6674f0"
migrations_dir = "migrations"

[vars]
SITE_NAME = "Pekora"

[[r2_buckets]]
binding = "MODELS"
bucket_name = "pekora-models"
