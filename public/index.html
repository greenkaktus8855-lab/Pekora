<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0074bd">
  <meta name="description" content="Pekora community website">
  <title>Pekora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/openpekora-globals.css">
  <link rel="stylesheet" href="/openpekora-text.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/openpekora-icons.css">
  <link rel="stylesheet" href="/openpekora-layout.css">
</head>
<body class="font-SourceSans">
  <div class="navbar-wrapper-main">
    <header class="op-navbar">
      <div class="op-navbar-inner">
        <button class="op-mobile-menu" id="mobileMenu" type="button" aria-label="Toggle navigation"><span class="icon-nav-menu"></span></button>
        <a class="op-logo" href="#home" data-page="home" aria-label="Pekora home">
          <img src="https://raw.githubusercontent.com/Blue7366/OpenPekora/main/frontend/public/img/pekora-logo.png" alt="Pekora">
        </a>
        <nav class="op-navigation" aria-label="Main navigation">
          <a href="#home" data-page="home">Home</a>
          <a href="#catalog" data-page="catalog">Catalog</a>
          <a href="#games" data-page="games">Games</a>
          <a href="#users" data-page="users">People</a>
        </nav>
        <form class="op-search" id="globalSearchForm">
          <input id="globalSearch" type="search" maxlength="20" placeholder="Search" aria-label="Search Pekora">
          <button type="submit" aria-label="Search"><span class="icon-nav-search"></span></button>
        </form>
        <div class="op-account" id="accountArea"></div>
        <a class="op-currency" id="currency" href="#currency" data-page="currency"></a>
      </div>
    </header>
  </div>
  <div class="site-layout op-site-layout">
    <aside id="sidebar" class="sidebar op-sidebar" aria-label="Account navigation"></aside>
    <main id="app" class="main-content op-main-content" tabindex="-1"></main>
  </div>
  <footer class="site-footer op-footer">
    <div class="footer-inner">
      <nav class="footer-links">
        <a href="#home" data-page="home">Home</a>
        <a href="#catalog" data-page="catalog">Catalog</a>
        <a href="#games" data-page="games">Games</a>
        <a href="#users" data-page="users">People</a>
        <a href="#about" data-page="about">About Us</a>
        <a href="#terms" data-page="terms">Terms</a>
        <a href="#privacy" data-page="privacy">Privacy</a>
      </nav>
      <p>© 2026 Pekora. Pekora is an independent community project and is not affiliated with Roblox Corporation.</p>
      <p>Pekora currency is a virtual site currency with no real-world monetary value.</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/controls/OrbitControls.js"></script>
  <script src="/openpekora-avatar-renderer.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
